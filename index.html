<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.S. QuickShifter - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --container-bg: #1a1a24;
            --ktm-orange: #FF6600;
            --text-color: #ffffff;
            --text-muted: #8b8b9c;
            --accent-green: #00E676;
            --accent-red: #ff1744;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: var(--ktm-orange);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4rem;
        }

        .status-bar {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* I CONTENITORI CON IL COLORE DELLA MOTO (BORDATI IN KTM ORANGE) */
        .container {
            background-color: var(--container-bg);
            border: 2px solid var(--ktm-orange);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.15);
            box-sizing: border-box;
        }

        .container h3 {
            margin-top: 0;
            color: var(--ktm-orange);
            font-size: 1.1rem;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 102, 0, 0.3);
            padding-bottom: 8px;
        }

        /* DATI TELEMETRIA FISSI A -- */
        .telemetria-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .tel-val {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-color);
            font-family: monospace;
        }

        .tel-lbl {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* PULSANTI CURATI E PROFESSIONALI */
        button {
            background-color: #2a2a35;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Pulsanti di sblocco/blocco specifici */
        .btn-lock {
            background-color: var(--accent-red);
            color: white;
            border: none;
        }

        .btn-unlock {
            background-color: var(--accent-green);
            color: #000;
            border: none;
        }

        /* Griglia pulsanti Pop & Bang */
        .pop-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn-pop {
            padding: 10px 5px;
            font-size: 0.85rem;
        }

        .btn-pop.active {
            background-color: var(--ktm-orange);
            color: black;
            font-weight: bold;
            border: none;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        /* Slider Timing */
        .slider-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slider-val {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: var(--ktm-orange);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #2a2a35;
            height: 8px;
            border-radius: 5px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--ktm-orange);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>S.O.S. QuickShifter</h2>
    <div class="status-bar" id="ble-status">Stato: Disconnesso</div>

    <div class="container">
        <h3>Telemetria Real-Time</h3>
        <div class="telemetria-grid">
            <div>
                <div class="tel-val" id="rpm-val">--</div>
                <div class="tel-lbl">Giri/Min (RPM)</div>
            </div>
            <div>
                <div class="tel-val" id="speed-val">--</div>
                <div class="tel-lbl">Velocità (Km/h)</div>
            </div>
        </div>
    </div>

    <div class="container">
        <h3>Fine Tuning Cut-Off</h3>
        <div class="slider-wrapper">
            <div class="slider-val"><span id="ms-val">75</span> ms</div>
            <input type="range" id="cut-slider" min="30" max="120" value="75" oninput="aggiornaSlider(this.value)">
        </div>
    </div>

    <div class="container">
        <h3>Configurazione Pop & Bang</h3>
        <div class="pop-grid">
            <button class="btn-pop active" id="pop0" onclick="impostaPop(0)">OFF</button>
            <button class="btn-pop" id="pop1" onclick="impostaPop(1)">MOD 1</button>
            <button class="btn-pop" id="pop2" onclick="impostaPop(2)">MOD 2</button>
            <button class="btn-pop" id="pop3" onclick="impostaPop(3)">MOD 3</button>
        </div>
    </div>

    <div class="container">
        <h3>Gestione Chiave Elettronica</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-unlock" onclick="inviaStatoEcu('UNLOCKED')">SBLOCCA</button>
            <button class="btn-lock" onclick="inviaStatoEcu('LOCKED')">BLOCCA</button>
        </div>
    </div>

    <script>
        // Variabili Bluetooth Web API
        let bleDevice = null;
        let rxCharacteristic = null;
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        // Funzione per connettersi/inviare dati all'ESP32 (Logica BLE integrata)
        async function inviaDatiEcu(jsonObj) {
            console.log("Inviando:", jsonObj);
            if (!rxCharacteristic) {
                // Se non siamo connessi, questa è solo una demo visiva dell'interfaccia
                return;
            }
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(JSON.stringify(jsonObj));
                await rxCharacteristic.writeValue(data);
            } catch (error) {
                console.error("Errore invio BLE:", error);
            }
        }

        function aggiornaSlider(val) {
            document.getElementById('ms-val').innerText = val;
            inviaDatiEcu({ type: "slider", value: parseInt(val) });
        }

        function impostaPop(mode) {
            // Rimuove la classe attiva da tutti i pulsanti pop
            for(let i=0; i<=3; i++) {
                document.getElementById(`pop${i}`).classList.remove('active');
            }
            // La aggiunge a quello cliccato
            document.getElementById(`pop${mode}`).classList.add('active');
            
            inviaDatiEcu({ type: "scoppi", value: mode });
        }

        function inviaStatoEcu(stato) {
            inviaDatiEcu({ type: "ecu_state", status: stato });
            alert("Comando inviato: " + stato);
        }
    </script>
</body>
</html>
