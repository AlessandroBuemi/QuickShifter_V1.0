<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>QS / Control Studio · v3</title>
<style>
        /* ==========================================================================
           DESIGN SYSTEM v9 — minimal racing / premium
           Superfici piatte, bordi hairline, colore brand usato come accento (non
           come sfondo saturo), Orbitron riservato ai soli numeri chiave.
           ========================================================================== */
        :root {
            --accent: #ff6a00; --accent-2: #ffb066;
            --bg-dark: #0b0c0e; --bg-gradient: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,255,255,0.05), transparent);
            --panel: rgba(255,255,255,0.035); --panel-border: rgba(255,255,255,0.09);
            --panel-glow: rgba(255,106,0,0.18);
            --text-main: #f2f1ef; --text-muted: #97968f;
            --btn-bg: rgba(255,255,255,0.05); --box-bg: rgba(255,255,255,0.03);
            --slider-track: rgba(255,255,255,0.12);
            --btn-active-text: #12100e;
            --text-on-panel: #f2f1ef; --text-muted-on-panel: #97968f;
            --hairline: rgba(255,255,255,0.09);
            --ok: #33d17a; --danger: #ff5252; --warn: #ffb020; --info: #3ea8ff;
        }
        body.brand-ktm      { --accent: #ff6a00; --accent-2: #ffb066; --panel-glow: rgba(255,106,0,0.18); }
        body.brand-yamaha   { --accent: #2f7de0; --accent-2: #7fb2ff; --panel-glow: rgba(47,125,224,0.18); }
        body.brand-beta     { --accent: #e5393f; --accent-2: #ff8b8f; --panel-glow: rgba(229,57,63,0.18); }
        body.brand-tm       { --accent: #17a7d6; --accent-2: #7fd8f2; --panel-glow: rgba(23,167,214,0.18); }
        body.brand-kawasaki { --accent: #2fb84f; --accent-2: #8fe0a4; --panel-glow: rgba(47,184,79,0.18); }
